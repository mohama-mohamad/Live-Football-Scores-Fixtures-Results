# نشر تلقائي على Cloudflare عند كل دفع (push)
# يتطلب سراً في GitHub: CLOUDFLARE_API_TOKEN
# واختيارياً API_FOOTBALL_KEY للبيانات الحقيقية (يُتحقق منه ويُفعّل تلقائياً)
name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/sleepy-babbage-8d3xny]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN مفقود::أضف السر CLOUDFLARE_API_TOKEN من Settings > Secrets and variables > Actions ثم أعد التشغيل"
            exit 1
          fi

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$ACCOUNT_ID" ] && export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          npx wrangler d1 migrations apply koora-live --remote

      # البيانات الحقيقية: إن وُجد السر API_FOOTBALL_KEY نتحقق منه ونفعّله تلقائياً،
      # وإلا (أو إن كانت الخطة لا تسمح بالبيانات الحالية) نبقى على البيانات التجريبية
      - name: Configure data provider
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          [ -n "$ACCOUNT_ID" ] && export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          provider=mock; limit=100; poll=60
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "لا يوجد API_FOOTBALL_KEY — سيعمل التطبيق بالبيانات التجريبية" >> "$GITHUB_STEP_SUMMARY"
          else
            api() { curl -s -H "x-apisports-key: $API_FOOTBALL_KEY" "https://v3.football.api-sports.io$1"; }
            errs() { jq -r '(.errors // []) | if type=="array" then join(" | ") else (to_entries|map(.value|tostring)|join(" | ")) end' 2>/dev/null || echo "رد غير صالح من API-Football"; }
            status=$(api /status)
            err=$(echo "$status" | errs)
            plan=$(echo "$status" | jq -r '.response.subscription.plan // "?"' 2>/dev/null || echo "?")
            limit=$(echo "$status" | jq -r '.response.requests.limit_day // 100' 2>/dev/null || echo 100)
            case "$limit" in ''|*[!0-9]*) limit=100;; esac
            if [ -n "$err" ]; then
              echo "::warning title=مفتاح API-Football غير صالح::$err"
              echo "⚠️ مفتاح API-Football غير صالح: $err — بقينا على البيانات التجريبية" >> "$GITHUB_STEP_SUMMARY"
            else
              today=$(date -u +%F)
              e1=$(api "/fixtures?date=$today" | errs)
              season=$(api "/leagues?id=39&current=true" | jq -r '.response[0].seasons[0].year // empty' 2>/dev/null || true)
              e2=$( [ -n "$season" ] && api "/standings?league=39&season=$season" | errs || echo "no season")
              if [ -n "$e1$e2" ]; then
                echo "::warning title=خطة API-Football لا تتيح البيانات الحالية::$e1 $e2"
                echo "⚠️ خطة API-Football ($plan) لا تتيح مباريات اليوم أو الموسم الحالي: $e1 $e2 — بقينا على البيانات التجريبية" >> "$GITHUB_STEP_SUMMARY"
              else
                provider=api-football
                # 60% من الحد اليومي للمتابعة المباشرة، موزّعة على نحو 10 ساعات مباريات يومياً
                poll=$(( 36000 * 10 / (limit * 6) ))
                [ "$poll" -lt 60 ] && poll=60
                echo "$API_FOOTBALL_KEY" | npx wrangler secret put API_FOOTBALL_KEY
                echo "✅ بيانات حقيقية من API-Football — الخطة: $plan، الحد اليومي: $limit، التحديث المباشر كل $poll ثانية" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "DEPLOY_VARS=--var PROVIDER:$provider --var DAILY_REQUEST_LIMIT:$limit --var LIVE_POLL_SECONDS:$poll" >> "$GITHUB_ENV"

      - name: Deploy worker + app
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$ACCOUNT_ID" ] && export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          npx wrangler deploy $DEPLOY_VARS | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_ENV"
          echo "### 🚀 تم النشر" >> "$GITHUB_STEP_SUMMARY"
          echo "رابط التطبيق: $url" >> "$GITHUB_STEP_SUMMARY"

      # فحص سريع للنسخة المنشورة: الصفحة، الـ Service Worker، والواجهة
      - name: Smoke test
        run: |
          [ -n "$url" ] || { echo "::warning::لم يُعثر على رابط workers.dev"; exit 0; }
          sleep 5
          check() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 3 "$url$1")
            type=$(curl -s -o /dev/null -w '%{content_type}' "$url$1")
            echo "$1 -> $code ($type)"
            [ "$code" = "200" ] || { cat /tmp/body; exit 1; }
            case "$type" in *"$2"*) ;; *) echo "::error::$1 نوع غير متوقع: $type"; exit 1;; esac
          }
          check / text/html
          check /sw.js javascript
          check /manifest.webmanifest manifest
          check /api/meta json
          check /api/live json
          check "/api/matches?date=$(date -u +%F)&tz=Asia/Riyadh" json
          curl -s "$url/api/live" | head -c 300; echo
