# وسيط API-Football: خوادم Cloudflare مرفوضة لدى API-Football، فتجلب هذه المهمة البيانات من GitHub
# وترسلها إلى الخادم موقّعة (HMAC بمفتاح API-Football نفسه — لا حاجة لسر جديد).
# الخادم يقرّر ماذا يحتاج (GET /api/__relay/plan) ويحترم الحد اليومي، فلا تُهدر الطلبات.
name: API-Football relay

on:
  schedule:
    # كل 15 دقيقة في ساعات المباريات (UTC)، وكل ساعة في الباقي
    - cron: '*/15 11-22 * * *'
    - cron: '0 0-10,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      APP_URL: ${{ vars.APP_URL || 'https://koora-live.mmido80.workers.dev' }}
    steps:
      - name: Fetch and push
        run: |
          [ -n "$API_FOOTBALL_KEY" ] || { echo "لا يوجد API_FOOTBALL_KEY"; exit 0; }
          plan=$(curl -sf --retry 3 "$APP_URL/api/__relay/plan") || { echo "::warning::تعذّر جلب الخطة"; exit 0; }
          echo "plan: $plan"
          leagues=$(echo "$plan" | jq -c '.leagues')
          api() {
            curl -s --retry 2 -H "x-apisports-key: $API_FOOTBALL_KEY" "https://v3.football.api-sports.io$1"
          }
          # الرد صالح إن خلا من الأخطاء
          ok() { jq -e '((.errors // []) | length) == 0 and (.response | type == "array")' >/dev/null 2>&1; }

          echo '{}' > payload.json
          add() { jq -c "$1" --slurpfile v "$2" ${3:+--arg k "$3"} payload.json > p.tmp && mv p.tmp payload.json; }

          if [ "$(echo "$plan" | jq -r '.live')" = true ]; then
            ids=$(echo "$leagues" | jq -r 'join("-")')
            api "/fixtures?live=$ids" > live.json
            if ok < live.json; then
              jq -c '.response' live.json > v.json && add '.live = $v[0]' v.json
              echo "مباشر: $(jq length v.json)"
              # مباريات كانت جارية واختفت من المباشر: نجلب نتيجتها النهائية
              missing=$(echo "$plan" | jq -r --slurpfile v v.json '[.ids[] | select(. as $i | ($v[0] | map(.fixture.id) | index($i)) | not)] | join("-")')
              if [ -n "$missing" ]; then
                api "/fixtures?ids=$missing" > finals.json
                ok < finals.json && jq -c '.response' finals.json > v.json && add '.finals = $v[0]' v.json
              fi
            else
              echo "::warning::المباشر: $(jq -c '.errors' live.json 2>/dev/null)"
            fi
          fi

          for d in $(echo "$plan" | jq -r '.days[]'); do
            api "/fixtures?date=$d&timezone=UTC" > day.json
            if ok < day.json; then
              jq -c --argjson L "$leagues" '[.response[] | select(.league.id as $l | $L | index($l))]' day.json > v.json
              add '.days[$k] = $v[0]' v.json "$d"
              echo "$d: $(jq length v.json)"
            else
              echo "::warning::$d: $(jq -c '.errors' day.json 2>/dev/null)"
            fi
          done

          if [ "$(jq 'length' payload.json)" = 0 ]; then echo "لا شيء لإرساله"; exit 0; fi
          jq -c --argjson ts "$(date +%s%3N)" '. + {ts: $ts}' payload.json > body.json
          sig=$(openssl dgst -sha256 -hmac "$API_FOOTBALL_KEY" -hex < body.json | awk '{print $NF}')
          echo "حجم: $(wc -c < body.json) بايت"
          code=$(curl -s -o res.json -w '%{http_code}' --retry 2 -X POST "$APP_URL/api/__relay/ingest" \
            -H 'content-type: application/json' -H "x-relay-signature: $sig" --data-binary @body.json)
          echo "ingest -> $code $(cat res.json)"
          [ "$code" = 200 ] || exit 1
