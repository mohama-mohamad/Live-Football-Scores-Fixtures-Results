# وسيط API-Football: خوادم Cloudflare مرفوضة لدى API-Football، فتجلب هذه المهمة البيانات من GitHub
# وترسلها إلى الخادم موقّعة (HMAC بمفتاح API-Football نفسه — لا حاجة لسر جديد).
# المهمة حلقة مستمرة (scripts/af-relay.sh): الخادم يحدد متى يُسأل API-Football حسب المباريات الجارية
# والفرق المفضلة والرصيد اليومي، وقبل حد الست ساعات تشغّل المهمة نسختها التالية.
# الجدولة أدناه احتياطية فقط (جدولة GitHub غير منتظمة)، لإعادة التشغيل إن توقفت السلسلة.
name: API-Football relay

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# نسخة واحدة تعمل في أي وقت؛ التشغيل الجديد ينتظر انتهاء الحالي
concurrency:
  group: af-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Relay loop
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://koora-live.mmido80.workers.dev' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -n "$API_FOOTBALL_KEY" ] || { echo "لا يوجد API_FOOTBALL_KEY"; exit 0; }
          scripts/af-relay.sh
