# فحص يدوي لما تتيحه خطة API-Football وحدود الطلبات (يستهلك طلباً أو طلبين)
name: API-Football plan check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        env:
          KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::API_FOOTBALL_KEY غير موجود"; exit 1; }
          api() { curl -s -D /tmp/h -H "x-apisports-key: $KEY" "https://v3.football.api-sports.io$1"; }
          hdr() { grep -iE '^x-ratelimit|^retry-after' /tmp/h | tr -d '\r'; }
          echo "== status (لا يُحتسب)"; api /status | jq -c '{plan: .response.subscription.plan, requests: .response.requests, errors}'; hdr
          echo "== live"; api '/fixtures?live=39-140-135-78-61-307-2-233' | jq -c '{results, errors}'; hdr
