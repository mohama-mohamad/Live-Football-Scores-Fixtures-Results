<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14924f"/>
      <stop offset="1" stop-color="#0b5a31"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- خطوط الملعب -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="10">
    <line x1="0" y1="256" x2="512" y2="256"/>
    <circle cx="256" cy="256" r="150"/>
  </g>
  <!-- الكرة -->
  <g transform="translate(256 256)">
    <circle r="112" fill="#ffffff"/>
    <polygon points="0,-44 42,-14 26,36 -26,36 -42,-14" fill="#0f2a1b"/>
    <g stroke="#0f2a1b" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="-44" x2="0" y2="-96"/>
      <line x1="42" y1="-14" x2="92" y2="-30"/>
      <line x1="26" y1="36" x2="58" y2="80"/>
      <line x1="-26" y1="36" x2="-58" y2="80"/>
      <line x1="-42" y1="-14" x2="-92" y2="-30"/>
    </g>
    <circle r="112" fill="none" stroke="#0f2a1b" stroke-width="8"/>
  </g>
  <!-- نقطة "مباشر" -->
  <circle cx="392" cy="120" r="34" fill="#ff3b30" stroke="#ffffff" stroke-width="10"/>
</svg>
